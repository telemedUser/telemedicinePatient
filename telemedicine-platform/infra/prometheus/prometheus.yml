global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: telemedicine-local
    environment: dev

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers: []

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: consul
    metrics_path: /v1/agent/metrics
    params:
      format: ['prometheus']
    static_configs:
      - targets: ['consul:8500']

  - job_name: consul-services
    consul_sd_configs:
      - server: consul:8500
        services: []
    relabel_configs:
      - source_labels: [__meta_consul_service]
        target_label: job
      - source_labels: [__meta_consul_service]
        target_label: service
      - source_labels: [__meta_consul_service_address, __meta_consul_service_port]
        separator: ':'
        target_label: __address__
      - source_labels: [__meta_consul_tags]
        regex: .*metrics-path=/actuator/prometheus.*
        action: keep
      - target_label: __metrics_path__
        replacement: /actuator/prometheus
      - source_labels: [__meta_consul_service]
        regex: gateway|external-simulators|template-java
        action: keep

  - job_name: gateway-static
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['gateway:8080']
        labels:
          service: gateway

  - job_name: external-simulators-static
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['external-simulators:8200']
        labels:
          service: external-simulators
