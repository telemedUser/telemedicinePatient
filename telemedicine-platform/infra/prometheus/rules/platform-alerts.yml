groups:
  - name: platform-baseline
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "Target {{ $labels.instance }} has been unreachable for more than 2 minutes."

      - alert: HighApiLatencyP95
        expr: histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (le, service)) > 0.3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "API p95 latency above 300ms for {{ $labels.service }}"
          description: "Design NFR target is average API latency < 300ms."

      - alert: ConsulServiceDeregistered
        expr: consul_catalog_service_nodeHealthy == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Consul service unhealthy: {{ $labels.service_name }}"

      - alert: KafkaConsumerLagHigh
        expr: kafka_consumer_group_lag > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Kafka consumer lag high for {{ $labels.consumergroup }}"

      - alert: OutboxPublishStalled
        expr: increase(outbox_unpublished_total[10m]) > 0 and rate(outbox_published_total[10m]) == 0
        for: 10m
        labels:
          severity: critical
          runbook: RB-007
        annotations:
          summary: "Outbox publisher stalled in {{ $labels.service }}"
          description: "Unpublished outbox events are accumulating with zero publish rate for 10 minutes."

      - alert: DLQMessagesAccumulating
        expr: sum(kafka_topic_partition_current_offset{topic=~".*\\.dlq"}) - sum(kafka_topic_partition_oldest_offset{topic=~".*\\.dlq"}) > 100
        for: 5m
        labels:
          severity: warning
          runbook: RB-008
        annotations:
          summary: "Dead-letter queue depth above threshold"
          description: "DLQ topic {{ $labels.topic }} has more than 100 unconsumed messages."

      - alert: VideoProviderFailover
        expr: increase(video_provider_failover_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
          runbook: RB-009
        annotations:
          summary: "Video provider failover detected"
          description: "Service {{ $labels.service }} failed over from {{ $labels.from_provider }} to {{ $labels.to_provider }}."

      - alert: HighIdentityFailureRate
        expr: rate(identity_validation_failed_total[5m]) / clamp_min(rate(identity_validation_attempts_total[5m]), 1) > 0.15
        for: 5m
        labels:
          severity: warning
          runbook: RB-010
        annotations:
          summary: "Identity validation failure rate above 15%"
          description: "Check FONASA simulator/vendor connectivity and lockout policies."

      - alert: ConsultationAbandonmentHigh
        expr: rate(consultation_abandoned_total[15m]) / clamp_min(rate(consultation_started_total[15m]), 1) > 0.20
        for: 15m
        labels:
          severity: warning
          runbook: RB-011
        annotations:
          summary: "Consultation abandonment rate above 20%"
          description: "Review waiting-room timeouts, video provider health, and patient notifications."

      - alert: CertificateExpiringSoon
        expr: (probe_ssl_earliest_cert_expiry - time()) / 86400 < 30
        for: 1h
        labels:
          severity: warning
          runbook: RB-011
        annotations:
          summary: "TLS certificate expiring within 30 days"
          description: "Certificate for {{ $labels.instance }} expires in {{ $value | humanizeDuration }}."

  - name: slo-recording-rules
    rules:
      - record: slo:api_availability:ratio
        expr: |
          sum(rate(http_server_requests_seconds_count{status!~"5.."}[5m]))
          /
          clamp_min(sum(rate(http_server_requests_seconds_count[5m])), 1)

      - record: slo:api_latency_p95:seconds
        expr: |
          histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket[5m])) by (le, service))

      - record: slo:api_error_budget:burn_rate_1h
        expr: |
          (1 - slo:api_availability:ratio) / (1 - 0.999)

      - record: slo:api_error_budget:burn_rate_6h
        expr: |
          avg_over_time(slo:api_error_budget:burn_rate_1h[6h])

      - alert: SLOBurnRateCritical
        expr: slo:api_error_budget:burn_rate_1h > 14.4 and slo:api_error_budget:burn_rate_6h > 6
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "SLO error budget burn rate critical for {{ $labels.service }}"
          description: "Availability SLO (99.9%) burn rate exceeds multi-window threshold."

      - alert: SLOBurnRateWarning
        expr: slo:api_error_budget:burn_rate_1h > 6
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "SLO error budget burn rate elevated"
          description: "Review recent deployments and upstream dependency health."
