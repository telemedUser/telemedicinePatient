# Canonical Telemedicine Platform stack — profile-driven.
# Phase 0 default:  COMPOSE_PROFILES=infra,observability,sim,edge  (see .env.example)
# Full stack apps:  COMPOSE_PROFILES=infra,observability,sim,edge,platform,apps
# Domain services:  COMPOSE_PROFILES=infra,observability,sim,edge,platform,domain

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-resources-small: &resources-small
  deploy:
    resources:
      limits:
        cpus: "0.50"
        memory: 512M

x-resources-medium: &resources-medium
  deploy:
    resources:
      limits:
        cpus: "1.00"
        memory: 1G

services:
  # ── Profile: infra ──────────────────────────────────────────────────────────
  consul:
    profiles: [infra]
    image: ${CONSUL_IMAGE}
    command: agent -server -bootstrap-expect=1 -ui -client=0.0.0.0 -bind=0.0.0.0 -config-file=/consul/config/consul.hcl
    ports:
      - "${CONSUL_PORT}:8500"
    volumes:
      - ./infra/consul/consul.hcl:/consul/config/consul.hcl:ro
      - consuldata:/consul/data
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    logging: *default-logging
    <<: *resources-small

  postgres:
    profiles: [infra]
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    logging: *default-logging
    <<: *resources-medium

  redis:
    profiles: [infra]
    image: ${REDIS_IMAGE}
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --appendfsync everysec
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging
    <<: *resources-small

  kafka:
    profiles: [infra]
    image: ${KAFKA_IMAGE}
    ports:
      - "${KAFKA_HOST_PORT}:29092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_HOST_PORT}
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafkadata:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging
    <<: *resources-medium

  kafka-init:
    profiles: [infra]
    image: ${KAFKA_IMAGE}
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infra/kafka/topics.txt:/topics/topics.txt:ro
      - ./infra/kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      TOPICS_FILE: /topics/topics.txt
    restart: "no"
    logging: *default-logging

  minio:
    profiles: [infra]
    image: ${MINIO_IMAGE}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    logging: *default-logging
    <<: *resources-small

  minio-init:
    profiles: [infra]
    image: ${MINIO_MC_IMAGE}
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./infra/minio/init-buckets.sh:/init-buckets.sh:ro
    entrypoint: ["/bin/sh", "/init-buckets.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
    restart: "no"
    logging: *default-logging

  keycloak:
    profiles: [infra]
    image: ${KEYCLOAK_IMAGE}
    command: start-dev --import-realm --health-enabled=true
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT}:8080"
    volumes:
      - ./infra/keycloak/realm-telemedicine.json:/opt/keycloak/data/import/realm-telemedicine.json:ro
      - keycloakdata:/opt/keycloak/data
    healthcheck:
      test: ["CMD-SHELL", "test -f /proc/1/status || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s
    restart: unless-stopped
    logging: *default-logging
    <<: *resources-medium

  # ── Profile: observability ──────────────────────────────────────────────────
  prometheus:
    profiles: [observability]
    image: ${PROMETHEUS_IMAGE}
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/rules:/etc/prometheus/rules:ro
      - prometheusdata:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    depends_on:
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    logging: *default-logging
    <<: *resources-small

  jaeger:
    profiles: [observability]
    image: ${JAEGER_IMAGE}
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT}:16686"
      - "${JAEGER_OTLP_GRPC_PORT}:4317"
      - "${JAEGER_OTLP_HTTP_PORT}:4318"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:14269/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    logging: *default-logging
    <<: *resources-small

  # ── Profile: logs (opt-in) ──────────────────────────────────────────────────
  elasticsearch:
    profiles: [logs]
    image: ${ELASTICSEARCH_IMAGE}
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${ELASTICSEARCH_PORT}:9200"
    volumes:
      - elasticsearchdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    logging: *default-logging
    <<: *resources-medium

  # ── Profile: sim ────────────────────────────────────────────────────────────
  external-simulators:
    profiles: [sim]
    build:
      context: ../telemedicine-backend
      dockerfile: docker/Dockerfile.spring-service
      args:
        GRADLE_MODULE: external-simulators
    ports:
      - "${SIMULATORS_PORT}:8200"
    environment:
      CONSUL_HOST: consul
      CONSUL_PORT: "8500"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
    depends_on:
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8200/actuator/health 2>/dev/null || curl -sf http://localhost:8200/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    restart: unless-stopped
    logging: *default-logging
    <<: *resources-small

  # ── Profile: edge ───────────────────────────────────────────────────────────
  gateway:
    profiles: [edge]
    build:
      context: ../telemedicine-backend
      dockerfile: docker/Dockerfile.spring-service
      args:
        GRADLE_MODULE: gateway
    ports:
      - "${GATEWAY_PORT}:8080"
    environment:
      CONSUL_HOST: consul
      CONSUL_PORT: "8500"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT_INTERNAL}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      KEYCLOAK_JWK_URI: ${KEYCLOAK_JWK_URI}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    depends_on:
      consul:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
      external-simulators:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health 2>/dev/null || curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    logging: *default-logging
    <<: *resources-medium

  # ── Profile: platform (config, audit, scheduler, BFFs) ─────────────────────
  config-service:
    profiles: [platform]
    build:
      context: ../telemedicine-backend
      dockerfile: docker/Dockerfile.spring-service
      args:
        GRADLE_MODULE: config-service
    environment:
      CONSUL_HOST: consul
      CONSUL_PORT: "8500"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: config
      DB_USER: config
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT_INTERNAL}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP}
      KEYCLOAK_JWK_URI: ${KEYCLOAK_JWK_URI}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
    depends_on:
      consul:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8112/actuator/health 2>/dev/null || curl -sf http://localhost:8112/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped
    logging: *default-logging
    <<: *resources-small

  audit-service:
    profiles: [platform]
    build:
      context: ../telemedicine-backend
      dockerfile: docker/Dockerfile.spring-service
      args:
        GRADLE_MODULE: audit-service
    environment:
      CONSUL_HOST: consul
      CONSUL_PORT: "8500"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: audit
      DB_USER: audit
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      KEYCLOAK_JWK_URI: ${KEYCLOAK_JWK_URI}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
    depends_on:
      consul:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8111/actuator/health 2>/dev/null || curl -sf http://localhost:8111/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped
    logging: *default-logging
    <<: *resources-small

  scheduler-service:
    profiles: [platform]
    build:
      context: ../telemedicine-backend
      dockerfile: docker/Dockerfile.spring-service
      args:
        GRADLE_MODULE: scheduler-service
    environment:
      CONSUL_HOST: consul
      CONSUL_PORT: "8500"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: scheduler
      DB_USER: scheduler
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP}
      KEYCLOAK_JWK_URI: ${KEYCLOAK_JWK_URI}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
    depends_on:
      consul:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      audit-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8113/actuator/health 2>/dev/null || curl -sf http://localhost:8113/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped
    logging: *default-logging
    <<: *resources-small

  patient-bff:
    profiles: [platform]
    build:
      context: ../telemedicine-backend
      dockerfile: docker/Dockerfile.spring-service
      args:
        GRADLE_MODULE: patient-bff
    environment:
      CONSUL_HOST: consul
      CONSUL_PORT: "8500"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      KEYCLOAK_JWK_URI: ${KEYCLOAK_JWK_URI}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
    depends_on:
      consul:
        condition: service_healthy
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8090/actuator/health 2>/dev/null || curl -sf http://localhost:8090/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    logging: *default-logging
    <<: *resources-small

  physician-bff:
    profiles: [platform]
    build:
      context: ../telemedicine-backend
      dockerfile: docker/Dockerfile.spring-service
      args:
        GRADLE_MODULE: physician-bff
    environment:
      CONSUL_HOST: consul
      CONSUL_PORT: "8500"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      KEYCLOAK_JWK_URI: ${KEYCLOAK_JWK_URI}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
    depends_on:
      consul:
        condition: service_healthy
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8091/actuator/health 2>/dev/null || curl -sf http://localhost:8091/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    logging: *default-logging
    <<: *resources-small

  admin-bff:
    profiles: [platform]
    build:
      context: ../telemedicine-backend
      dockerfile: docker/Dockerfile.spring-service
      args:
        GRADLE_MODULE: admin-bff
    environment:
      CONSUL_HOST: consul
      CONSUL_PORT: "8500"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      KEYCLOAK_JWK_URI: ${KEYCLOAK_JWK_URI}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
    depends_on:
      consul:
        condition: service_healthy
      config-service:
        condition: service_healthy
      audit-service:
        condition: service_healthy
      scheduler-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8092/actuator/health 2>/dev/null || curl -sf http://localhost:8092/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped
    logging: *default-logging
    <<: *resources-small

  # ── Profile: domain (core domain services 8101–8110) ────────────────────────
  waiting-room-service:
    profiles: [domain]
    build:
      context: ../telemedicine-backend
      dockerfile: docker/Dockerfile.spring-service
      args:
        GRADLE_MODULE: waiting-room-service
    environment:
      CONSUL_HOST: consul
      CONSUL_PORT: "8500"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: waiting_room
      DB_USER: waiting_room
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT_INTERNAL}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP}
      INTEGRATION_SERVICE_URL: http://integration-service:8107
      IDENTITY_SERVICE_URL: http://identity-service:8102
      KEYCLOAK_JWK_URI: ${KEYCLOAK_JWK_URI}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
    depends_on:
      consul:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8101/actuator/health 2>/dev/null || curl -sf http://localhost:8101/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped
    logging: *default-logging
    <<: *resources-small

  identity-service:
    profiles: [domain]
    build:
      context: ../telemedicine-backend
      dockerfile: docker/Dockerfile.spring-service
      args:
        GRADLE_MODULE: identity-service
    environment:
      CONSUL_HOST: consul
      CONSUL_PORT: "8500"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: identity
      DB_USER: identity
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP}
      INTEGRATION_SERVICE_URL: http://integration-service:8107
      WAITING_ROOM_URL: http://waiting-room-service:8101
      TELEMEDICINE_PHI_KEY: ${TELEMEDICINE_PHI_KEY:-v1:dGVzdC1pZGVudGl0eS1waGkta2V5MTIzNDU2Nzg=}
      KEYCLOAK_JWK_URI: ${KEYCLOAK_JWK_URI}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
    depends_on:
      consul:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8102/actuator/health 2>/dev/null || curl -sf http://localhost:8102/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped
    logging: *default-logging
    <<: *resources-small

  video-service:
    profiles: [domain]
    build:
      context: ../telemedicine-backend
      dockerfile: docker/Dockerfile.spring-service
      args:
        GRADLE_MODULE: video-service
    environment:
      CONSUL_HOST: consul
      CONSUL_PORT: "8500"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: video
      DB_USER: video
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP: ${KAFKA_BOOTSTRAP}
      CONFIG_SERVICE_URL: http://config-service:8112
      SIMULATOR_BASE_URL: http://external-simulators:8200
      WAITING_ROOM_URL: http://waiting-room-service:8101
      KEYCLOAK_JWK_URI: ${KEYCLOAK_JWK_URI}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
    depends_on:
      consul:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      external-simulators:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8103/actuator/health 2>/dev/null || curl -sf http://localhost:8103/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped
    logging: *default-logging
    <<: *resources-small

  telemetry-service:
    profiles: [domain]
    build:
      context: ../telemedicine-backend
      dockerfile: docker/Dockerfile.spring-service
      args:
        GRADLE_MODULE: telemetry-service
    environment:
      CONSUL_HOST: consul
      CONSUL_PORT: "8500"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      DB_HOST: postgres
