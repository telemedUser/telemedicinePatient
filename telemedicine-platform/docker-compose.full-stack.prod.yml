# Production-oriented compose with gateway API proxy on shell nginx.
# Copy apps/shell/nginx.full-stack.conf over the default shell nginx.conf before building,
# or mount this config in a custom shell image build step.

services:
  consul:
    image: hashicorp/consul:1.19
    command: agent -server -bootstrap-expect=1 -ui -client=0.0.0.0 -bind=0.0.0.0
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: ../telemedicine-backend
      dockerfile: gateway/Dockerfile
    environment:
      CONSUL_HOST: consul
      CONSUL_PORT: "8500"

  template-java:
    build:
      context: ../telemedicine-backend
      dockerfile: services/_template-java/Dockerfile
    environment:
      CONSUL_HOST: consul
      CONSUL_PORT: "8500"

  template-python:
    build:
      context: ../telemedicine-backend
      dockerfile: services/_template-python/Dockerfile
    environment:
      CONSUL_HOST: consul
      CONSUL_PORT: "8500"
      SERVICE_HOST: template-python
      SERVICE_PORT: "8082"

  shell:
    build:
      context: ../telemedicine-frontend
      dockerfile: apps/shell/Dockerfile
    ports:
      - "3000:80"
    volumes:
      - ../telemedicine-frontend/apps/shell/nginx.full-stack.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gateway

  template-mfe:
    build:
      context: ../telemedicine-frontend
      dockerfile: apps/_template-mfe/Dockerfile
    ports:
      - "3001:80"

networks:
  default:
    name: telemedicine-platform-prod
