# PDB + HPA for journey-critical domain services.
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: waiting-room-service-pdb
  namespace: telemedicine-backend
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: waiting-room-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: waiting-room-service-hpa
  namespace: telemedicine-backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: waiting-room-service
  minReplicas: 3
  maxReplicas: 15
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
