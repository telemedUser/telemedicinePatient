# Redis cluster mode — three primary shards for cache, rate limiting, and queue state.
apiVersion: v1
kind: ConfigMap
metadata:
  name: redis-cluster-config
  namespace: telemedicine
data:
  redis.conf: |
    port 6379
    cluster-enabled yes
    cluster-config-file /data/nodes.conf
    cluster-node-timeout 5000
    appendonly yes
    appendfsync everysec
    maxmemory 512mb
    maxmemory-policy allkeys-lru
  cluster-init.sh: |
    #!/bin/sh
    set -e
    HOST=$(hostname -f)
    redis-server /config/redis.conf --bind 0.0.0.0 --cluster-announce-hostname "$HOST" &
    PID=$!
    if [ "$(hostname)" = "redis-0" ]; then
      sleep 10
      redis-cli --cluster create \
        redis-0.redis-headless.telemedicine.svc.cluster.local:6379 \
        redis-1.redis-headless.telemedicine.svc.cluster.local:6379 \
        redis-2.redis-headless.telemedicine.svc.cluster.local:6379 \
        --cluster-replicas 0 --cluster-yes || true
    fi
    wait $PID
---
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: telemedicine
  labels:
    app: redis
spec:
  clusterIP: None
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
    - name: gossip
      port: 16379
      targetPort: 16379
  selector:
    app: redis
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: telemedicine
  labels:
    app: redis
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  selector:
    app: redis
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: redis-pdb
  namespace: telemedicine
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: telemedicine
spec:
  serviceName: redis-headless
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.2-alpine
          command: ["/bin/sh", "/config/cluster-init.sh"]
          ports:
            - containerPort: 6379
              name: redis
            - containerPort: 16379
              name: gossip
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
      volumes:
        - name: config
          configMap:
            name: redis-cluster-config
            defaultMode: 0755
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
