apiVersion: v1
kind: ConfigMap
metadata:
  name: telemedicine-backend-config
  namespace: telemedicine-backend
data:
  SPRING_PROFILES_ACTIVE: kubernetes,prod
  KAFKA_BOOTSTRAP: kafka-0.kafka-headless.telemedicine.svc.cluster.local:9092,kafka-1.kafka-headless.telemedicine.svc.cluster.local:9092,kafka-2.kafka-headless.telemedicine.svc.cluster.local:9092
  REDIS_HOST: redis
  REDIS_CLUSTER_NODES: redis-0.redis-headless.telemedicine.svc.cluster.local:6379,redis-1.redis-headless.telemedicine.svc.cluster.local:6379,redis-2.redis-headless.telemedicine.svc.cluster.local:6379
  POSTGRES_HOST: postgres-primary.telemedicine.svc.cluster.local
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger.telemedicine.svc.cluster.local:4317
  TELEMEDICINE_ENV: prod
