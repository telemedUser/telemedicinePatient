apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../

replicas:
  - name: gateway
    count: 2
  - name: patient-bff
    count: 2
  - name: physician-bff
    count: 2
  - name: admin-bff
