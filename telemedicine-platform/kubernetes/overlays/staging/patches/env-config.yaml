apiVersion: v1
kind: ConfigMap
metadata:
  name: telemedicine-backend-config
  namespace: telemedicine-backend
data:
  SPRING_PROFILES_ACTIVE: kubernetes,staging
  KAFKA_BOOTSTRAP: kafka-0.kafka-headless.telemedicine.svc.cluster.local:9092,kafka-1.kafka-headless.telemedicine.svc.cluster.local:9092,kafka-2.kafka-headless.telemedicine.svc.cluster.local:9092
  REDIS_HOST: redis
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger.telemedicine.svc.cluster.local:4317
  TELEMEDICINE_ENV: staging
