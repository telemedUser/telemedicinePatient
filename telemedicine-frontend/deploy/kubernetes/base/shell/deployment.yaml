apiVersion: apps/v1
kind: Deployment
metadata:
  name: shell
  namespace: telemedicine-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shell
  template:
    metadata:
      labels:
        app: shell
    spec:
      containers:
        - name: shell
          image: telemedicine/shell:0.1.0
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: shell
  namespace: telemedicine-frontend
spec:
  selector:
    app: shell
  ports:
    - port: 80
      targetPort: 80
