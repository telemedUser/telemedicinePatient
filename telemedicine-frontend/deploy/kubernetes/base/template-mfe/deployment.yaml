apiVersion: apps/v1
kind: Deployment
metadata:
  name: template-mfe
  namespace: telemedicine-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: template-mfe
  template:
    metadata:
      labels:
        app: template-mfe
    spec:
      containers:
        - name: template-mfe
          image: telemedicine/template-mfe:0.1.0
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: template-mfe
  namespace: telemedicine-frontend
spec:
  selector:
    app: template-mfe
  ports:
    - port: 80
      targetPort: 80
