server:
  port: 8090

spring:
  application:
    name: patient-bff
  profiles:
    active: dev
  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:8500}
      discovery:
        enabled: true
        register: true
        prefer-ip-address: true
        health-check-path: /actuator/health

telemedicine:
  security:
    mode: ${SECURITY_MODE:jwt}
    jwt:
      jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://keycloak:8080/realms/telemedicine/protocol/openid-connect/certs}
      issuer-uri: ${KEYCLOAK_ISSUER_URI:http://keycloak:8080/realms/telemedicine}
  bff:
    downstream:
      waiting-room-service: lb://waiting-room-service
      identity-service: lb://identity-service
      integration-service: lb://integration-service
      video-service: lb://video-service
      clinical-docs-service: lb://clinical-docs-service
      survey-service: lb://survey-service
    rest-client:
      connect-timeout: 500ms
      read-timeout: 2000ms

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
