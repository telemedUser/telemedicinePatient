spring:
  cloud:
    consul:
      discovery:
        enabled: false
  datasource:
    url: jdbc:h2:mem:survey;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/migration/common
  kafka:
    listener:
      auto-startup: false

telemedicine:
