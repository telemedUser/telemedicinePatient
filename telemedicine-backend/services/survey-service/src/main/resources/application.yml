server:
  port: 8108

spring:
  profiles:
    active: dev
  application:
    name: survey-service
  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:8500}
      discovery:
        enabled: true
        register: true
        prefer-ip-address: true
        health-check-path: /actuator/health
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:survey}
    username: ${DB_USER:telemedicine}
    password: ${DB_PASSWORD:telemedicine}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/migration/common
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}

telemedicine:
  events:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
  survey:
    default-channel: email
    dispatch-backup-minutes: 15

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  api-docs:
    path: /v3/api-docs
