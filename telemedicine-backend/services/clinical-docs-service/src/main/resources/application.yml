server:
  port: 8105

spring:
  profiles:
    active: dev
  application:
    name: clinical-docs-service
  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:8500}
      discovery:
        enabled: true
        register: true
        prefer-ip-address: true
        health-check-path: /actuator/health
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:clinical_docs}
    username: ${DB_USER:telemedicine}
    password: ${DB_PASSWORD:telemedicine}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/migration/common
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}

telemedicine:
  events:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
  integration:
    config-service-base-url: ${CONFIG_SERVICE_URL:http://config-service:8112}
    simulator:
      base-url: ${SIMULATOR_BASE_URL:http://external-simulators:8090}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ROOT_USER:minio}
    secret-key: ${MINIO_ROOT_PASSWORD:change-me-locally}
  clinical-docs:
    clinical-documents-bucket: clinical-documents
    prescriptions-bucket: prescriptions
    download-token-ttl: PT1H
    public-base-url: ${CLINICAL_DOCS_PUBLIC_URL:http://localhost:8105}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  api-docs:
    path: /v3/api-docs
