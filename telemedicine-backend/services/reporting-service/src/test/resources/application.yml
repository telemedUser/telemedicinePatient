spring:
  cloud:
    consul:
      discovery:
        enabled: false
  datasource:
    url: jdbc:h2:mem:reporting;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/migration/common
  kafka:
    bootstrap-servers: localhost:9092

telemedicine:
  security:
    mode: dev
  events:
    bootstrap-servers: localhost:9092
  minio:
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
  reporting:
    export-bucket: audit-exports
    export-prefix: reporting/
    export-url-ttl: PT1H
