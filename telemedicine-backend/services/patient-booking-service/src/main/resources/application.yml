server:
  port: 8120

spring:
  profiles:
    active: dev
  main:
    # The shared @EnableTelemedicinePersistence and PersistenceAutoConfiguration both enable JPA
    # auditing, which registers the same AuditingHandler bean twice. They are identical, so allow
    # the later definition to win rather than failing startup.
    allow-bean-definition-overriding: true
  application:
    name: patient-booking-service
  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:8500}
      discovery:
        enabled: true
        register: true
        prefer-ip-address: true
        health-check-path: /actuator/health
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:patient_booking}
    username: ${DB_USER:patient_booking}
    password: ${DB_PASSWORD:change-me-locally}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:change-me-locally}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/migration/common
    # Local dev: seed migrations get edited during the demo; don't fail boot on a checksum drift.
    validate-on-migrate: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      # The shared java-common-events KafkaEventPublisher sends a byte[] value. When
      # spring.kafka is present, Spring Boot's default ProducerFactory would otherwise win with a
      # StringSerializer and fail on the byte[] body, so pin the value serializer here.
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer

telemedicine:
  security:
    # Local development only: permit-all HTTP chain. DevSecurityConfiguration then seeds a patient
    # principal so platform method security passes. Never set on a real profile.
    mode: ${TELEMEDICINE_SECURITY_MODE:DEV}
  events:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
  integration:
    config-service-base-url: ${CONFIG_SERVICE_URL:http://config-service:8112}

# CORS origins allowed for local dev (frontend dev server / Vite proxy).
patient-booking:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3001,http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
