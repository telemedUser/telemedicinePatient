server:
  port: 8120

spring:
  profiles:
    active: dev
  application:
    name: patient-booking-service

# CORS origins allowed for local dev (frontend dev server / Vite proxy)
patient-booking:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3001,http://localhost:5173}

# AI triage (patient-ai module). Uses an OpenAI-compatible chat endpoint
# (default: Groq free tier). Supply the key via GROQ_API_KEY; without it the
# module falls back to rule-based questions.
patient:
  ai:
    enabled: ${AI_ENABLED:true}
    base-url: ${AI_BASE_URL:https://api.groq.com/openai/v1}
    model: ${AI_MODEL:llama-3.3-70b-versatile}
    api-key: ${GROQ_API_KEY:${PATIENT_AI_API_KEY:}}
    max-questions: ${AI_MAX_QUESTIONS:5}
    timeout-ms: ${AI_TIMEOUT_MS:15000}