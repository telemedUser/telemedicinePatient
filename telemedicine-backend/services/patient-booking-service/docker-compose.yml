services:
  postgres:
    image: postgres:16
    container_name: patient-booking-postgres
    environment:
      POSTGRES_DB: telemedicine
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
    ports:
      - "5432:5432"
    volumes:
      - patient-booking-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U booking -d telemedicine"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  patient-booking-pgdata: