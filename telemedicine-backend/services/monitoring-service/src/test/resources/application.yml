spring:
  cloud:
    consul:
      discovery:
        enabled: false
  datasource:
    url: jdbc:h2:mem:monitoring;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/migration/common
  kafka:
    bootstrap-servers: localhost:9092
  data:
    redis:
      host: localhost
      port: 6379

telemedicine:
  security:
    mode: dev
  events:
    bootstrap-servers: localhost:9092
  monitoring:
    quality-degraded-threshold: 50
    snapshot-cache-key: monitoring:snapshot:test
    snapshot-cache-ttl: PT30S
    slo-window-minutes: 60
    notification-service-base-url: http://localhost:18086
