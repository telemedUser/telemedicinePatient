spring:
  cloud:
    consul:
      discovery:
        enabled: false
  datasource:
    url: jdbc:h2:mem:identity;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/migration/common
  kafka:
    bootstrap-servers: localhost:9092

telemedicine:
  security:
    mode: dev
    consent:
      enabled: false
      http-verifier-enabled: false
  identity:
    max-attempts: 3
    lockout-duration: PT15M
    integration-service-base-url: http://localhost:18082
  persistence:
    phi-encryption:
      key: v1:dGVzdC1pZGVudGl0eS1waGkta2V5MTIzNDU2Nzg=
