spring:
  cloud:
    consul:
      discovery:
        enabled: false
  datasource:
    url: jdbc:h2:mem:notification;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/migration/common
  kafka:
    bootstrap-servers: localhost:9092

telemedicine:
  security:
    mode: dev
  integration:
    config-service-base-url: http://localhost:18112
    simulator:
      base-url: http://localhost:18086
  notification:
    default-locale: es
    reminder-window-hours: 24
    integration-service-base-url: http://localhost:18087
