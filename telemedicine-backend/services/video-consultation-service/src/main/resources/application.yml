server:
  port: 8130

spring:
  application:
    name: video-consultation-service
  profiles:
    active: dev
  datasource:
    # Singular shared telemedicine database (same instance/schema as booking).
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:telemedicine}
    username: ${DB_USER:telemedicine}
    password: ${DB_PASSWORD:telemedicine}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Shared database: other services own their own migration history table.
    table: flyway_schema_history_video_consultation
    baseline-on-migrate: true
    validate-on-migrate: false

video-consultation:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3001,http://localhost:3002}

management:
  endpoints:
    web:
      exposure:
        include: health,info