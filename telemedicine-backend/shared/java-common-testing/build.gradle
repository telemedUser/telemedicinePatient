plugins {
    id 'telemedicine.java-library-conventions'
    id 'telemedicine.quality-conventions'
    id 'telemedicine.publishing-conventions'
}

description = 'Shared test fixtures: Testcontainers, JWT helpers, event assertions, contract tests and ArchUnit rules.'

dependencies {
    api project(':java-common-core')
    api project(':java-common-security')
    api project(':java-common-events')
    api project(':java-common-web')

    api libs.junit.jupiter
    api libs.assertj.core
    api libs.awaitility
    api libs.archunit.junit5
    api libs.wiremock.standalone
    api libs.swagger.request.validator.core
    api libs.testcontainers.junit.jupiter
    api libs.testcontainers.postgresql
    api libs.testcontainers.kafka
    api libs.testcontainers.minio
    api libs.keycloak.testcontainers
    api libs.nimbus.jose.jwt

    api 'org.springframework.boot:spring-boot-starter-test'
    api 'org.springframework.security:spring-security-test'
    api 'org.springframework.boot:spring-boot-starter-web'

    testImplementation libs.testcontainers.core
}

def platformKeycloakRealm =
        rootProject.layout.projectDirectory
                .dir('../telemedicine-platform/infra/keycloak/realm-telemedicine.json')
                .asFile

tasks.named('processTestResources') {
    from(platformKeycloakRealm.parentFile) {
        include platformKeycloakRealm.name
    }
}

tasks.named('processIntegrationTestResources') {
    from(platformKeycloakRealm.parentFile) {
        include platformKeycloakRealm.name
    }
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'integration'
    }
}

tasks.named('integrationTest') {
    useJUnitPlatform {
        includeTags 'integration'
    }
}

def jacocoClassTree =
        fileTree(layout.buildDirectory.dir('classes/java/main')) {
            exclude 'com/telemedicine/common/testing/containers/**'
        }

tasks.named('jacocoTestReport') {
    classDirectories.setFrom(jacocoClassTree)
}

tasks.named('jacocoTestCoverageVerification') {
    classDirectories.setFrom(jacocoClassTree)
}
