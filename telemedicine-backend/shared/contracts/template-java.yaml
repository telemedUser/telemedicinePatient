openapi: 3.0.3
info:
  title: Template Java Service
  version: 0.1.0
paths:
  /api/v1/template-java/hello:
    get:
      summary: Hello endpoint
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponse"
components:
  schemas:
