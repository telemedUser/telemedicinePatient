org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# --- Shared library release line -------------------------------------------------
# Versioned independently of the services (which stay on 0.1.0-SNAPSHOT).
# Semver policy: patch = fix, minor = additive, major = breaking.
# Breaking changes are blocked by japicmp unless -PjapicmpBaseline is deliberately moved.
sharedLibsVersion=1.0.0

# --- Toolchain / plugin versions --------------------------------------------------
springBootVersion=3.3.5
springCloudVersion=2023.0.3
checkstyleVersion=10.18.2
jacocoVersion=0.8.12

# --- Publishing coordinates -------------------------------------------------------
# Credentials come from the GH_PACKAGES_USER / GH_PACKAGES_TOKEN environment variables;
# without them only publishToMavenLocal is wired up.
githubOwner=bupa-research
githubRepo=telemedicine
