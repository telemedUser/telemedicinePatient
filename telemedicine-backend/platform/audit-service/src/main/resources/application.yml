server:
  port: 8111

spring:
  profiles:
    active: dev
  application:
    name: audit-service
  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: ${CONSUL_PORT:8500}
      discovery:
        enabled: true
        register: true
        prefer-ip-address: true
        health-check-path: /actuator/health
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:audit}
    username: ${DB_USER:audit}
    password: ${DB_PASSWORD:change-me-locally}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/migration/common
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}

telemedicine:
  events:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
  audit-service:
    retention-days: ${AUDIT_RETENTION_DAYS:2555}
    export-bucket: audit-exports
    export-url-ttl: PT24H
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ROOT_USER:minio}
    secret-key: ${MINIO_ROOT_PASSWORD:change-me-locally}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
