apiVersion: apps/v1
kind: Deployment
metadata:
  name: patient-bff
  namespace: telemedicine-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: patient-bff
  template:
    metadata:
      labels:
        app: patient-bff
    spec:
      containers:
        - name: patient-bff
          image: telemedicine/patient-bff:0.1.0
          ports:
            - containerPort: 8090
          envFrom:
            - configMapRef:
                name: telemedicine-backend-config
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8090
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8090
            initialDelaySeconds: 60
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: patient-bff
  namespace: telemedicine-backend
spec:
  type: ClusterIP
  selector:
    app: patient-bff
  ports:
    - port: 8090
      targetPort: 8090
