apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler-service
  namespace: telemedicine-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scheduler-service
  template:
    metadata:
      labels:
        app: scheduler-service
    spec:
      containers:
        - name: scheduler-service
          image: telemedicine/scheduler-service:0.1.0
          ports:
            - containerPort: 8113
          envFrom:
            - configMapRef:
                name: telemedicine-backend-config
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8113
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8113
            initialDelaySeconds: 60
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: scheduler-service
  namespace: telemedicine-backend
spec:
  type: ClusterIP
  selector:
    app: scheduler-service
  ports:
    - port: 8113
      targetPort: 8113
