apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-service
  namespace: telemedicine-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: identity-service
  template:
    metadata:
      labels:
        app: identity-service
    spec:
      containers:
        - name: identity-service
          image: telemedicine/identity-service:0.1.0
          ports:
            - containerPort: 8102
          envFrom:
            - configMapRef:
                name: telemedicine-backend-config
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8102
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8102
            initialDelaySeconds: 60
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: identity-service
  namespace: telemedicine-backend
spec:
  type: ClusterIP
  selector:
    app: identity-service
  ports:
    - port: 8102
      targetPort: 8102
