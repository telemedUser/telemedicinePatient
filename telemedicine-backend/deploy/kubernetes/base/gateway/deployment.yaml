apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: telemedicine-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: telemedicine/gateway:0.1.0
          ports:
            - containerPort: 8080
          env:
            - name: CONSUL_HOST
              value: consul
            - name: CONSUL_PORT
              value: "8500"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: telemedicine-backend
spec:
  selector:
    app: gateway
  ports:
    - port: 8080
      targetPort: 8080
