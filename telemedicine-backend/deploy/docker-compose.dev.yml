services:
  consul:
    image: hashicorp/consul:1.19
    command: agent -server -bootstrap-expect=1 -ui -client=0.0.0.0 -bind=0.0.0.0
    ports:
      - "8500:8500"
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      CONSUL_HOST: consul
      CONSUL_PORT: "8500"
    depends_on:
      consul:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health 2>/dev/null || curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  template-java:
    build:
      context: ..
      dockerfile: services/_template-java/Dockerfile
    environment:
      CONSUL_HOST: consul
      CONSUL_PORT: "8500"
      SERVER_PORT: "8081"
    depends_on:
      consul:
        condition: service_healthy

  template-python:
    build:
      context: ..
      dockerfile: services/_template-python/Dockerfile
    environment:
      CONSUL_HOST: consul
      CONSUL_PORT: "8500"
      SERVICE_PORT: "8082"
      SERVICE_HOST: template-python
    depends_on:
      consul:
        condition: service_healthy

networks:
  default:
    name: telemedicine-backend
